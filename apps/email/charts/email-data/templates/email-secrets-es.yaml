apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: email-secrets-es
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: email-secrets
    template:
      type: Opaque
      engineVersion: v2
      data:
        # Host is the Postgres Service owned by this release (controllers.postgres,
        # forceRename "<release>-postgres" in values.yaml). Hardcoded because the
        # whole string is a backtick-raw template evaluated by the ExternalSecret
        # controller, not Helm -- same precedent as notification-secrets-es.yaml.
        ConnectionStrings__email: {{ `"Host=email-data-postgres;Database=email;Username={{ .pg_user }};Password={{ .pg_password }}"` }}
        Resend__ApiKey: {{ `"{{ .resend_api_key }}"` }}
        Resend__WebhookSecret: {{ `"{{ .resend_webhook_secret }}"` }}
  data:
  - secretKey: pg_user
    remoteRef:
      key: secrets-k8/email/{{ .Values.vault.environment }}/postgres
      property: user
  - secretKey: pg_password
    remoteRef:
      key: secrets-k8/email/{{ .Values.vault.environment }}/postgres
      property: password
  - secretKey: resend_api_key
    remoteRef:
      key: secrets-k8/email/{{ .Values.vault.environment }}/resend
      property: apiKey
  - secretKey: resend_webhook_secret
    remoteRef:
      key: secrets-k8/email/{{ .Values.vault.environment }}/resend
      property: webhookSecret

apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notification-secrets-es
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: notification-secrets
    template:
      type: Opaque
      engineVersion: v2
      data:
        # PostgreSQL connection string (Npgsql format). Host is the dedicated
        # Postgres owned by the notification-data release (see
        # controllers.postgres, forceRename to "<release>-postgres" in
        # values.yaml). Hardcoded rather than templated with .Release.Name
        # because this whole string is a backtick-raw Go template literal
        # (evaluated by the ExternalSecret controller, not Helm) -- a
        # Release.Name expression here would leak through unevaluated. Matches
        # the same precedent in filestore-secrets-es.yaml.
        ConnectionStrings__notification: {{ `"Host=notification-data-postgres;Database=notification;Username={{ .pg_user }};Password={{ .pg_password }}"` }}
        # Shared-secret bearer token validated by the hub's /internal/push
        # endpoint -- both notification-api (caller) and notification-hub
        # (validator) read this same value from this same Secret. See
        # plans/notifications/realtime-spec.md#internal-push-endpoint-api--hub.
        Notification__HubInternalToken: {{ `"{{ .hub_internal_token }}"` }}
  data:
  - secretKey: pg_user
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/postgres
      property: user
  - secretKey: pg_password
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/postgres
      property: password
  - secretKey: hub_internal_token
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/hub-token
      property: token

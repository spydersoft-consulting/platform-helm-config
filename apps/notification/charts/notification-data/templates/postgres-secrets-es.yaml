apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  # App-qualified, not the generic "postgres-secrets-es" -- notification-data
  # shares platform-{env} with other apps, and the generic name has already
  # collided once (identity-server vs. filestore-data — see filestore's
  # postgres-secrets-es.yaml). Avoid repeating that.
  name: notification-postgres-secrets-es
spec:
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: notification-postgres-secrets
  data:
  - secretKey: POSTGRES_USER
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/postgres
      property: rootUser
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/postgres
      property: rootPassword
  - secretKey: POSTGRES_NON_ROOT_USER
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/postgres
      property: user
  - secretKey: POSTGRES_NON_ROOT_PASSWORD
    remoteRef:
      key: secrets-k8/notification/{{ .Values.vault.environment }}/postgres
      property: password
